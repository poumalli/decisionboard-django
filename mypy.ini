[mypy]
plugins = mypy_django_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = config.settings

[mypy-*.migrations.*]
ignore_errors = True

# core.views combine des mixins de contexte (extra_context par section) avec
# les CBV génériques de Django — django-stubs signale des faux positifs
# "misc" (extra_context/object incompatibles avec ContextMixin/DeletionMixin)
# sur ce pattern d'héritage multiple, sans impact à l'exécution.
[mypy-core.views]
disable_error_code = misc
